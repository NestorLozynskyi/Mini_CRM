spring:
  application:
    name: mini-crm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/minicrm}
    username: ${DB_USERNAME:minicrm}
    password: ${DB_PASSWORD:minicrm}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Caddy передає X-Forwarded-For/-Proto: реальна IP клієнта (ліміти демо/входу) і HTTPS (Secure cookie).
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  session:
    ttl: ${APP_SESSION_TTL:P30D}
  demo:
    ttl: PT24H
    per-ip-limit: ${APP_DEMO_PER_IP_LIMIT:10}
    per-ip-window: PT1H
    max-active: ${APP_DEMO_MAX_ACTIVE:2000}
    cleanup-interval: PT5M
    tombstone-retention: P7D
  login:
    max-failures: 10
    window: PT15M
